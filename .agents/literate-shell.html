<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding Agent Tutorial — Literate Walkthrough</title>
  <style>
    :root {
      color-scheme: light;

      --paper:      #f6f7f9;
      --card:       #ffffff;
      --ink:        #11161d;
      --ink-soft:   #55606d;
      --ink-faint:  #8b95a1;
      --rule:       #e0e5ec;
      --rule-firm:  #c9d1da;
      --accent:     #0f6e66;
      --accent-bg:  #eef5f4;
      --signal:     #9a5416;
      --signal-bg:  #fbf3e9;

      --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
      --serif: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;

      --label: 0.7rem/1 var(--mono);

      /* Line-group colours, linking a run of code to the note explaining it.
         They are only ever drawn as rules and edges, never as fills behind
         text, so they can stay saturated and easy to tell apart. Amber is
         deliberately absent: it means "pressure test". */
      --g1: #0f766e;
      --g2: #1d4ed8;
      --g3: #7c3aed;
      --g4: #475569;
      --g5: #15803d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--serif);
      font-size: 1.0625rem;
      line-height: 1.7;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    /* Shared eyebrow treatment: mono, tracked out, small. Used for every
       machine-facing label so prose and apparatus never look alike. */
    .key-concept h3,
    .demo h3,
    .pressure-test strong,
    .iteration-number {
      font: var(--label);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* ---- masthead ---- */
    header {
      padding: 5rem 2rem 2.75rem;
      border-bottom: 1px solid var(--rule-firm);
      background: var(--card);
    }
    header > * { max-width: 66ch; margin: 0 auto; }
    header h1 {
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 600;
      letter-spacing: -0.018em;
      line-height: 1.12;
      margin-bottom: 0.85rem;
    }
    header p {
      font-size: 1.15rem;
      color: var(--ink-soft);
      text-wrap: pretty;
    }

    /* ---- the rail: one continuous line, a station per iteration ---- */
    .container {
      max-width: 1680px;
      margin: 0 auto;
      padding: 3.5rem 2rem 1rem 4.25rem;
      position: relative;
    }
    .container::before {
      content: "";
      position: absolute;
      left: 1.85rem;
      top: 5.3rem;
      bottom: 4rem;
      width: 1px;
      background: var(--rule-firm);
    }

    .iteration {
      position: relative;
      margin-bottom: 3.5rem;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 4px;
    }
    /* station dot, punched out of the rail */
    .iteration::before {
      content: "";
      position: absolute;
      left: -2.68rem;
      top: 1.55rem;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px var(--paper);
    }

    .iteration-header {
      display: flex;
      align-items: baseline;
      gap: 0.9rem;
      padding: 1.15rem 1.6rem 1.05rem;
      border-bottom: 1px solid var(--rule);
    }
    .iteration-number { color: var(--accent); }
    .iteration-title {
      font-family: var(--serif);
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Explanation leads, code follows. `order` does the swap so the source
       stays in the reading order the workflow's template describes. */
    .split { display: grid; grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr); }
    .explanation-panel { order: 1; }
    .code-panel { order: 2; }
    @media (max-width: 940px) {
      .split { grid-template-columns: minmax(0, 1fr); }
    }

    /* ---- code ---- */
    .code-panel {
      padding: 1.6rem 1.5rem;
      border-left: 1px solid var(--rule);
      overflow-x: auto;
    }
    @media (max-width: 940px) {
      .code-panel { border-left: 0; border-top: 1px solid var(--rule); }
    }
    /* font-size:0 collapses the whitespace between code-line spans, so the
       listing needs no source-level minification to render exactly. */
    .code-block {
      font-family: var(--mono);
      font-size: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    /* Every line reserves the margin rule, so tagged and untagged lines keep
       the same indent and the numbers stay in one column. */
    .code-line {
      display: block;
      font-size: 0.845rem;
      line-height: 1.62;
      border-left: 3px solid transparent;
      padding-left: 0.6rem;
    }
    .code-line:hover { background: var(--paper); }
    .line-num {
      display: inline-block;
      width: 2.5em;
      padding-right: 1em;
      text-align: right;
      color: var(--ink-faint);
      user-select: none;
    }

    .keyword  { color: #0b5ea8; }
    .string   { color: #1a7f5a; }
    .comment  { color: var(--ink-faint); font-style: italic; }
    .function { color: #7b3fa0; }
    .variable { color: #232b34; }
    .operator { color: #6b7480; }
    .number   { color: #0b5ea8; }

    /* ---- line groups: a margin rule in the code, a bounding box on the note ---- */
    .code-line.g1 { border-left-color: var(--g1); }
    .code-line.g2 { border-left-color: var(--g2); }
    .code-line.g3 { border-left-color: var(--g3); }
    .code-line.g4 { border-left-color: var(--g4); }
    .code-line.g5 { border-left-color: var(--g5); }

    .note {
      border: 1px solid var(--rule-firm);
      border-left-width: 3px;
      border-radius: 0 4px 4px 0;
      padding: 0.85rem 1.05rem 0.9rem;
      margin-bottom: 1rem;
      background: var(--card);
    }
    .note > p { margin-bottom: 0.5rem; }
    .note > p:last-child { margin-bottom: 0; }
    .note strong {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink-soft);
    }
    .note.g1 { border-color: var(--g1); }
    .note.g2 { border-color: var(--g2); }
    .note.g3 { border-color: var(--g3); }
    .note.g4 { border-color: var(--g4); }
    .note.g5 { border-color: var(--g5); }
    .note.g1 strong { color: var(--g1); }
    .note.g2 strong { color: var(--g2); }
    .note.g3 strong { color: var(--g3); }
    .note.g4 strong { color: var(--g4); }
    .note.g5 strong { color: var(--g5); }

    /* Curves joining each note to the run of code it explains. Drawn by the
       script at the end of the document, which measures where both actually
       land; without it the notes and margin rules still stand on their own. */
    .split { position: relative; }
    .joins {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }
    /* Joins rest dimmed so five curves read as texture rather than clutter;
       hovering a note or its code brings that one up and pushes the rest back. */
    .joins .join {
      opacity: 0.3;
      transition: opacity 0.15s ease, stroke-width 0.15s ease;
    }
    .joins.has-active .join { opacity: 0.08; }
    .joins .join.is-active { opacity: 1; stroke-width: 1.75; }
    .joins .cap { transition: opacity 0.15s ease; }

    /* outline, not border, so nothing reflows when a note lights up */
    .split[data-active] .note[class*="g"] { outline-offset: -1px; }
    .split[data-active="g1"] .note.g1 { outline: 1px solid var(--g1); }
    .split[data-active="g2"] .note.g2 { outline: 1px solid var(--g2); }
    .split[data-active="g3"] .note.g3 { outline: 1px solid var(--g3); }
    .split[data-active="g4"] .note.g4 { outline: 1px solid var(--g4); }
    .split[data-active="g5"] .note.g5 { outline: 1px solid var(--g5); }
    @media (max-width: 940px) { .joins { display: none; } }

    /* ---- explanation ---- */
    .explanation-panel { padding: 1.6rem 1.75rem; }
    .explanation-panel > h3 {
      font-family: var(--serif);
      font-size: 1.0625rem;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      margin-bottom: 1rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--rule);
    }
    .explanation-panel > h3:not(:first-child) { margin-top: 1.75rem; }
    .explanation-panel p { text-wrap: pretty; }
    .explanation-panel > p { margin-bottom: 0.95rem; }
    .explanation-panel ul { margin: 0 0 0.95rem 1.35rem; }
    .explanation-panel li { margin-bottom: 0.4rem; }

    code {
      font-family: var(--mono);
      font-size: 0.845em;
      padding: 0.1em 0.36em;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 3px;
      word-break: break-word;
    }

    /* The lesson itself: full width under the title, always visible, so the
       page can be read as a list of ideas without opening anything. */
    .key-concept {
      background: var(--accent-bg);
      padding: 1.15rem 1.6rem 1.3rem;
      border-bottom: 1px solid var(--rule);
    }
    .key-concept h3 { color: var(--accent); margin-bottom: 0.5rem; }
    .key-concept p { margin-bottom: 0; max-width: 90ch; }

    /* ---- collapsed detail ---- */
    .detail > summary {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 1.6rem;
      cursor: pointer;
      list-style: none;
      user-select: none;
      font: var(--label);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .detail > summary::-webkit-details-marker { display: none; }
    .detail > summary::before {
      content: "";
      width: 0;
      height: 0;
      border-left: 5px solid currentColor;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      transition: transform 0.15s ease;
    }
    .detail[open] > summary::before { transform: rotate(90deg); }
    .detail > summary:hover { color: var(--accent); background: var(--paper); }
    .detail[open] > summary { border-bottom: 1px solid var(--rule); }

    /* The handoff to the next iteration — the only amber on the page. */
    .pressure-test {
      margin-top: 1.4rem;
      padding: 0.95rem 1.15rem 1rem;
      background: var(--signal-bg);
      border-left: 2px solid var(--signal);
      border-radius: 0 3px 3px 0;
      font-size: 1rem;
    }
    .pressure-test strong {
      display: block;
      color: var(--signal);
      margin-bottom: 0.35rem;
    }

    /* ---- demo ---- */
    .demo {
      padding: 1.5rem 1.75rem 1.75rem;
      border-top: 1px solid var(--rule);
    }
    .demo h3 { color: var(--ink-soft); margin-bottom: 0.6rem; }
    .demo p { margin-bottom: 1rem; text-wrap: pretty; }
    .transcript {
      background: #12171e;
      color: #d6dde6;
      padding: 1.1rem 1.3rem;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.82rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
    }
    /* terminal chrome — shell prompts and tool banners, dimmed so the eye
       lands on the conversation itself */
    .transcript .shell-line { color: #6d7885; }
    .transcript .prompt-line { color: #7fd6a6; }
    .transcript .reply-line { color: #79b8f3; }

    footer {
      max-width: 1680px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem 4.25rem;
      font: var(--label);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Coding Agent Tutorial</h1>
    <p>A literate walkthrough — building a coding agent one iteration at a time</p>
  </header>

  <div class="container">

    <!-- ITERATIONS -->
  </div>

  <footer>
    <p><!-- FOOTER --></p>
  </footer>

  <script>
    // Draw a curve from each note's right edge to the margin rule of the code
    // run it explains. Positions are measured, not assumed, so the joins stay
    // correct at any width; the layer is decorative and re-drawn on resize.
    (function () {
      var SVG = "http://www.w3.org/2000/svg";
      var GROUPS = ["g1", "g2", "g3", "g4", "g5"];
      var stacked = window.matchMedia("(max-width: 940px)");

      function drawSplit(split) {
        var layer = split.querySelector(".joins");
        if (!layer) {
          layer = document.createElementNS(SVG, "svg");
          layer.setAttribute("class", "joins");
          layer.setAttribute("aria-hidden", "true");
          split.appendChild(layer);
        }
        while (layer.firstChild) layer.removeChild(layer.firstChild);
        if (stacked.matches) return;

        var frame = split.getBoundingClientRect();
        if (!frame.width || !frame.height) return;   // collapsed section
        layer.setAttribute("viewBox", "0 0 " + frame.width + " " + frame.height);
        layer.setAttribute("width", frame.width);
        layer.setAttribute("height", frame.height);

        var styles = getComputedStyle(document.documentElement);
        GROUPS.forEach(function (group) {
          var note = split.querySelector(".note." + group);
          var lines = split.querySelectorAll(".code-line." + group);
          if (!note || !lines.length) return;

          var n = note.getBoundingClientRect();
          var first = lines[0].getBoundingClientRect();
          var last = lines[lines.length - 1].getBoundingClientRect();

          var x1 = n.right - frame.left;
          var y1 = n.top + n.height / 2 - frame.top;
          var x2 = first.left - frame.left;
          var y2 = (first.top + last.bottom) / 2 - frame.top;
          var waist = x1 + (x2 - x1) / 2;

          var ink = styles.getPropertyValue("--" + group).trim();

          var path = document.createElementNS(SVG, "path");
          path.setAttribute("class", "join " + group);
          path.setAttribute("d",
            "M " + x1 + " " + y1 +
            " C " + waist + " " + y1 + ", " + waist + " " + y2 + ", " + x2 + " " + y2);
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", ink);
          path.setAttribute("stroke-width", "1");
          layer.appendChild(path);

          var cap = document.createElementNS(SVG, "circle");
          cap.setAttribute("class", "join cap " + group);
          cap.setAttribute("cx", x1);
          cap.setAttribute("cy", y1);
          cap.setAttribute("r", "2.5");
          cap.setAttribute("fill", ink);
          layer.appendChild(cap);
        });

        // a redraw rebuilds the paths, so restore whatever was lit
        var active = split.getAttribute("data-active");
        if (active) highlight(split, active);
      }

      // ResizeObserver can fire as a result of our own drawing; coalesce to
      // one pass per frame so it cannot chase its own tail.
      var pending = false;
      function draw() {
        if (pending) return;
        pending = true;
        requestAnimationFrame(function () {
          pending = false;
          document.querySelectorAll(".split").forEach(drawSplit);
        });
      }

      // Hover a note or any line of its run to bring that join forward.
      // Delegated, so it keeps working after every redraw.
      function highlight(split, group) {
        var layer = split.querySelector(".joins");
        if (!layer) return;
        layer.classList.toggle("has-active", !!group);
        layer.querySelectorAll(".join").forEach(function (el) {
          el.classList.toggle("is-active", !!group && el.classList.contains(group));
        });
        if (group) split.setAttribute("data-active", group);
        else split.removeAttribute("data-active");
      }

      function groupOf(node) {
        var owner = node && node.closest && node.closest(".note, .code-line");
        if (!owner) return null;
        for (var i = 0; i < GROUPS.length; i++) {
          if (owner.classList.contains(GROUPS[i])) return GROUPS[i];
        }
        return null;
      }

      document.querySelectorAll(".split").forEach(function (split) {
        split.addEventListener("mouseover", function (event) {
          highlight(split, groupOf(event.target));
        });
        split.addEventListener("mouseleave", function () { highlight(split, null); });
      });

      document.querySelectorAll(".detail").forEach(function (detail) {
        detail.addEventListener("toggle", draw);
      });

      draw();
      window.addEventListener("resize", draw);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
      if (window.ResizeObserver) {
        var observer = new ResizeObserver(draw);
        document.querySelectorAll(".split").forEach(function (s) { observer.observe(s); });
      }
    })();
  </script>
</body>
</html>
